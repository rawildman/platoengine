stages: [setup-spack, build-dependencies, build-install, test, unit-test, clean-up]

variables:
  SPACK_REPO: https://github.com/platoengine/spack.git
  SPACK_MIRROR_DIR: /home/gitlab-runner/spack-mirror
  RUNNER_HOME: /home/gitlab-runner
  
include:
  local: ci-templates.yml

setup-spack:
  stage: setup-spack
  extends: .setup-local-spack-installation
  variables:
    PLATO_ENGINE_SPEC: ${TRIGGER_PLATO_ENGINE_OPTIONS}
    THIRD_PARTY_SPEC: ${TRIGGER_THIRD_PARTY_OPTIONS}
    SPACK_DIR: ${RUNNER_HOME}/${TRIGGER_SPACK_DIR}
    SPACK_RESOURCE: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  tags:
    - ${CONFIGURATION}

build-dependencies:
  extends: .build-and-cache-dependencies
  variables:
    SPACK_DIR: ${RUNNER_HOME}/${TRIGGER_SPACK_DIR}
    SPACK_RESOURCE: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  tags:
    - ${CONFIGURATION}
  needs: ["setup-spack"]

build-install-platoengine:
  extends: .build-install-platoengine
  variables:
    SPACK_DIR: ${RUNNER_HOME}/${TRIGGER_SPACK_DIR}
    SPACK_RESOURCE: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  tags:
    - ${CONFIGURATION}
  needs: ["build-dependencies"]

test-platoengine:
  extends: .test-platoengine
  variables:
    SPACK_DIR: ${RUNNER_HOME}/${TRIGGER_SPACK_DIR}
    SPACK_RESOURCE: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  tags:
    - ${CONFIGURATION}
  needs: ["build-install-platoengine"]

unit-test-platoengine:
  parallel:
    matrix:
      - PLATO_ENGINE_UNIT_TESTER: [PlatoMainUnitTester, PlatoXMLGenerator_UnitTester, Plato_Operations_UnitTester, PlatoSu2ToExodus_UnitTester, PlatoTools_UnitTester]
  extends: .unit-test-platoengine
  variables:
    SPACK_DIR: ${RUNNER_HOME}/${TRIGGER_SPACK_DIR}
    SPACK_RESOURCE: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  tags:
    - ${CONFIGURATION}
  needs: ["build-install-platoengine"]

clean-build-cache:
  stage: clean-up
  extends: .clean-temporary-build-cache
  variables:
    SPACK_RESOURCE: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  tags:
    - ${CONFIGURATION}
  needs: ["test-platoengine"]
