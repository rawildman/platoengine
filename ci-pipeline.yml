stages: [setup-spack, build-dependencies, build-install, test, unit-test, coverage, report, clean-up]

variables:
  SPACK_REPO: https://gitlab-ci-token:${CI_JOB_TOKEN}@cee-gitlab.sandia.gov/plato/spack.git
  SPACK_MIRROR_DIR: /home/gitlab-runner/spack-mirror
  RUNNER_HOME: /home/gitlab-runner

include:
  local: ci-templates.yml

setup-spack:
  stage: setup-spack
  extends: .setup-local-spack-installation
  variables:
    PLATO_ENGINE_SPEC: ${TRIGGER_PLATO_ENGINE_OPTIONS}
    THIRD_PARTY_SPEC: ${TRIGGER_THIRD_PARTY_OPTIONS}
    SPACK_DIR: ${RUNNER_HOME}/${TRIGGER_SPACK_DIR}
    SPACK_RESOURCE: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  tags:
    - ${CONFIGURATION}

build-dependencies:
  extends: .build-and-cache-dependencies
  variables:
    SPACK_DIR: ${RUNNER_HOME}/${TRIGGER_SPACK_DIR}
    SPACK_RESOURCE: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  tags:
    - ${CONFIGURATION}
  needs: ["setup-spack"]

build-install-platoengine:
  extends: .build-install-platoengine
  variables:
    SPACK_DIR: ${RUNNER_HOME}/${TRIGGER_SPACK_DIR}
    SPACK_RESOURCE: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  tags:
    - ${CONFIGURATION}
  needs: ["build-dependencies"]

test-platoengine:
  extends: .test-platoengine
  variables:
    SPACK_DIR: ${RUNNER_HOME}/${TRIGGER_SPACK_DIR}
    SPACK_RESOURCE: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  tags:
    - ${CONFIGURATION}
  needs: ["build-install-platoengine"]

unit-test-platoengine:
  parallel:
    matrix:
      - PLATO_ENGINE_UNIT_TESTER: [PlatoMainUnitTester, PlatoXMLGenerator_UnitTester,  Plato_Operations_UnitTester,  PlatoSu2ToExodus_UnitTester, PlatoTools_UnitTester, PlatoModels_UnitTester]
  extends: .unit-test-platoengine
  variables:
    SPACK_DIR: ${RUNNER_HOME}/${TRIGGER_SPACK_DIR}
    SPACK_RESOURCE: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  tags:
    - ${CONFIGURATION}
  needs: ["build-install-platoengine"]

coverage-platoengine:
  parallel:
    matrix:
      - PLATO_ENGINE_FOLDER_PATTERN: [platoengine, analyze, data_layer, Filters, input_generator, interface, iso, models, operations, optimize, services, PlatoSubproblemLibrary, proxy, Su2Exodus, tools ]
  extends: .coverage-platoengine
  variables:
    SPACK_DIR: ${RUNNER_HOME}/${TRIGGER_SPACK_DIR}
    SPACK_RESOURCE: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
    PLATO_ENGINE_UNIT_TESTER: PlatoMainUnitTester  PlatoXMLGenerator_UnitTester  Plato_Operations_UnitTester  PlatoSu2ToExodus_UnitTester PlatoTools_UnitTester PlatoModels_UnitTester
  tags:
    - ${CONFIGURATION}
  rules:
    - if: $TRIGGER_KCOV == "false"
      when: never
    - when: always
  needs: ["unit-test-platoengine"]

coverage-report:
  stage: report
  resource_group: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  variables:
    SPACK_DIR: ${RUNNER_HOME}/${TRIGGER_SPACK_DIR}
    SPACK_RESOURCE: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  tags:
    - ${CONFIGURATION}
  rules:
    - if: $TRIGGER_KCOV == "false"
      when: never
    - when: always
  needs: ["coverage-platoengine"]
  script:
    - cd ${CI_PROJECT_DIR}/jobs_scratch_dir/coverage_platoengine/
    - grep -oP 'coverage line-rate="[0-9].[0-9]*"' ${CI_PROJECT_DIR}/jobs_scratch_dir/coverage_platoengine/kcov-merged/cobertura.xml | grep -oP '[0-9].[0-9]*' > grepcov.txt
    - perl -e 'print '`cat grepcov.txt`'*100' > prcnt
    - echo 'Percentage Covered '`cat prcnt`
  coverage: '/Percentage Covered \d+\.\d+/'
  artifacts:
    when: always
    paths:
      - "${CI_PROJECT_DIR}/jobs_scratch_dir/coverage_platoengine"
    reports:
      coverage_report:
        coverage_format: cobertura
        path: "${CI_PROJECT_DIR}/jobs_scratch_dir/coverage_platoengine/kcov-merged/cobertura.xml"
        
clean-build-cache:
  stage: clean-up
  extends: .clean-temporary-build-cache
  variables:
    SPACK_RESOURCE: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  tags:
    - ${CONFIGURATION}
  needs: ["test-platoengine"]
