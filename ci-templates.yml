.setup-local-spack-installation:
  stage: setup-spack
  # TODO: Replace below with ${SPACK_RESOURCE}, there's currently a bug
  # preventing expansion of nested variables.
  resource_group: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  script:
    - mkdir -p ${SPACK_DIR}
    - mkdir -p ${SPACK_MIRROR_DIR}
    - cd ${SPACK_DIR}
    - |
      if [ -d "./spack" ] 
      then 
        pushd spack && git pull && popd
        source spack/share/spack/setup-env.sh
        spack env activate --without-view .
        spack remove -af
      else
        git clone ${SPACK_REPO}
        source spack/share/spack/setup-env.sh
        spack env create -d .
        spack env activate --without-view .
        spack mirror add mirror ${SPACK_MIRROR_DIR}
      fi
    - echo "Adding spec platoengine@develop${PLATO_ENGINE_SPEC} ${THIRD_PARTY_SPEC}"
    - spack add platoengine@develop${PLATO_ENGINE_SPEC} ${THIRD_PARTY_SPEC}
    - spack develop --path ${CI_PROJECT_DIR} platoengine@develop
    - spack config add config:install_tree:padded_length:256

.build-and-cache-dependencies:
  stage: build-dependencies
  resource_group: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  timeout: 4 hours
  before_script:
    - echo "Building dependencies for branch ${CI_COMMIT_BRANCH}"
    - cd ${SPACK_DIR}
    - source spack/share/spack/setup-env.sh
  script:
    - spack env activate --without-view .
    - spack buildcache update-index -d ${SPACK_MIRROR_DIR}
    - spack concretize -f
    - spack install --use-cache --no-check-signature --only dependencies

.build-install-platoengine:
  stage: build-install
  resource_group: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  before_script:
    - echo "Building platoengine for branch ${CI_COMMIT_BRANCH}"
    - cd ${SPACK_DIR}
    - source spack/share/spack/setup-env.sh
  script: 
    - spack env activate --without-view .
    - spack uninstall -ay platoengine || true
    - spack install --overwrite --no-cache --only package
    - spack buildcache create --allow-root --rebuild-index --unsigned --only dependencies -d ${SPACK_MIRROR_DIR} platoengine
  artifacts:
    when: always
    paths:
      - "${CI_PROJECT_DIR}/spack-build-out.txt"
  cache:
    key: pe_build_cache_${CI_PIPELINE_ID}
    untracked: true
    policy: push

.test-platoengine:
  stage: test
  resource_group: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  before_script:
    - echo "Building platoengine for branch ${CI_COMMIT_BRANCH}"
    - cd ${SPACK_DIR}
    - source spack/share/spack/setup-env.sh
  script: 
    - spack env activate --without-view .
    - spack load platoengine
    - export PLATOENGINE_BUILD_DIR=$(spack location -b platoengine)
    - cd ${PLATOENGINE_BUILD_DIR}
    - ctest -L small --output-junit small_tests.xml || FAILURE=true
    - mkdir -p ${CI_PROJECT_DIR}/jobs_scratch_dir/
    - cp small_tests.xml ${CI_PROJECT_DIR}/jobs_scratch_dir/
    - if [ ${FAILURE} == "true" ]; then (exit 1); fi # Fail if ctest failed
  artifacts:
    when: always
    paths:
      - "${CI_PROJECT_DIR}/jobs_scratch_dir/small_tests.xml"
    reports:
      junit: 
        - "${CI_PROJECT_DIR}/jobs_scratch_dir/small_tests.xml"
  cache:
    key: pe_build_cache_${CI_PIPELINE_ID}
    untracked: true
    policy: pull

.unit-test-platoengine:
  stage: unit-test
  resource_group: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  before_script:
    - cd ${SPACK_DIR}
    - source spack/share/spack/setup-env.sh
  script: 
    - spack env activate --without-view .
    - spack load platoengine
    - ${PLATO_ENGINE_UNIT_TESTER} --gtest_output=xml:${CI_PROJECT_DIR}/jobs_scratch_dir/${PLATO_ENGINE_UNIT_TESTER}.xml
  artifacts:
    when: always
    paths:
      - "${CI_PROJECT_DIR}/jobs_scratch_dir/${PLATO_ENGINE_UNIT_TESTER}.xml"
    reports:
      junit: 
        - "${CI_PROJECT_DIR}/jobs_scratch_dir/${PLATO_ENGINE_UNIT_TESTER}.xml"

.clean-temporary-build-cache:
  stage: clean-up
  resource_group: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  when: always
  rules:
    - if: $CLEAN_CACHE == "true"
  script:
    - rm -rf /home/gitlab-runner/cache/${CI_PROJECT_PATH}/pe_build_cache_*${CI_PIPELINE_ID}*
